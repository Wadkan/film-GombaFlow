<!doctype html>
<meta charset="utf-8" />
<title>Local Studio UI test double — no Google connection</title>
<button onclick="document.querySelector('#ask-panel').hidden=false">Ask Studio</button>
<section id="ask-panel" hidden>
    <h2>Ask Studio</h2>
    <div id="ask-attachment" hidden>
        <a id="ask-video" href="/video/abcdefghijk/edit">Selected video</a>
        <button>Téli SUP</button><button>Remove</button>
    </div>
    <textarea id="ask-prompt" aria-label="Ask something"></textarea>
    <button onclick="document.querySelector('#ask-menu').hidden=false">Add files, reference videos, and more</button>
    <button onclick="window.sent=(window.sent||0)+1">Send</button>
</section>
<div id="ask-menu" role="menu" hidden>
    <button role="menuitem" onclick="this.parentElement.hidden=true; document.querySelector('#ask-picker').hidden=false">Select your video</button>
</div>
<div id="ask-picker" hidden>
    <input role="combobox" aria-label="Search your video">
    <div role="listbox" aria-label="Retrieved videos">
        <img src="/vi/abcdefghijk/default.jpg" alt="Video thumbnail: Téli SUP"
             onclick="document.querySelector('#ask-picker').hidden=true; document.querySelector('#ask-attachment').hidden=false">
    </div>
</div>
<style>
    ytcp-navigation-drawer,
    ytcp-video-metadata-editor,
    ytcp-playlist-dialog,
    ytcp-playlist-row,
    ytcp-endscreen-editor,
    ytcp-playlist-picker,
    ytcp-endscreen-element {
        display: block;
    }
    [hidden] {
        display: none !important;
    }
</style>
<ytcp-navigation-drawer
    ><a id="channel">Your channel</a></ytcp-navigation-drawer
>
<div id="save-toast" hidden>Changes saved</div>
<ytkc-made-for-kids-select>
    <label><input type="radio" name="kids" value="yes">Yes, it's made for kids</label>
    <label><input type="radio" name="kids" value="no" checked>No, it's not made for kids</label>
</ytkc-made-for-kids-select>
<ytcp-age-restriction-select>
    <label><input type="radio" name="age" value="yes">Yes, restrict my video to viewers over 18</label>
    <label><input type="radio" name="age" value="no" checked>No, don't restrict my video to viewers over 18 only</label>
</ytcp-age-restriction-select>
<ytcp-paid-product-placement-select>
    <label><input type="radio" name="paid" value="yes">Yes, my video includes paid promotion</label>
    <label><input type="radio" name="paid" value="no" checked>No, my video doesn’t include paid promotion</label>
</ytcp-paid-product-placement-select>
<ytkp-altered-content-select>
    <label><input type="radio" name="ai" value="yes" aria-label="Yes, AI was used">Yes</label>
    <label><input type="radio" name="ai" value="no" checked aria-label="No, AI wasn’t used">No</label>
</ytkp-altered-content-select>
<ytcp-video-metadata-editor>
    <a id="video">Video link</a>
    <button
        onclick="document.querySelector('ytcp-playlist-dialog').hidden = false"
    >
        Select playlists
    </button>
    <label
        >Video language
        <select
            aria-label="Video language"
            onchange="document.querySelector('#save-language').disabled = false"
        >
            <option value="en">English</option>
            <option value="hu">Hungarian</option>
        </select></label
    >
    <button id="save-language" disabled onclick="saveLanguage(this)">
        Save
    </button>
    <button onclick="openEditor()">End screen</button>
</ytcp-video-metadata-editor>
<ytcp-playlist-dialog hidden
    ><ytcp-playlist-row
        ><input type="checkbox" aria-checked="true" checked /><a id="membership"
            >Same playlist name</a
        ></ytcp-playlist-row
    ><button onclick="this.parentElement.hidden = true">
        Done
    </button></ytcp-playlist-dialog
>
<ytcp-endscreen-editor hidden>
    <p>End screens aren't visible on private videos</p>
    <div id="elements"></div>
    <button
        onclick="
            draft.splice(draft.indexOf(selected), 1);
            render();
        "
    >
        Delete element
    </button>
    <button
        onclick="
            draft = [
                { type: 'Video', best: false },
                { type: 'Playlist', id: '' },
                { type: 'Subscribe', id: channel },
            ];
            render();
        "
    >
        1 video, 1 playlist, 1 subscribe
    </button>
    <section id="options"></section>
    <button
        onclick="
            if (fault !== 'end-save') {
                localStorage.setItem('elements', JSON.stringify(draft));
                window.saves++;
            }
            this.parentElement.hidden = true;
        "
    >
        Save
    </button>
    <button onclick="this.parentElement.hidden = true">Cancel</button>
</ytcp-endscreen-editor>
<ytcp-playlist-picker hidden>
    <label
        >Search <input aria-label="Search" oninput="search(this.value)"
    /></label>
    <div id="results"></div>
</ytcp-playlist-picker>
<script>
    const video = "abcdefghijk",
        channel = "UCabcdefghijklmnopqrstuv",
        playlist = "PLabcdefghijklmnopqrstuv";
    const fault = localStorage.getItem("fault") || "";
    window.saves = Number(localStorage.getItem("saves") || 0);
    if (fault === "login") {
        document.body.innerHTML = '<a href="/login">Sign in</a>';
    } else {
        document.querySelector("#channel").href =
            "/channel/" +
            (fault === "channel" ? "UCxxxxxxxxxxxxxxxxxxxxxx" : channel);
        document.querySelector("#video").href =
            "https://www.youtube.com/watch?v=" +
            (fault === "video" ? "xxxxxxxxxxx" : video);
        document.querySelector("#membership").href =
            "https://www.youtube.com/playlist?list=" +
            (fault === "membership" ? "PLwrongplaylist" : playlist);
        document.querySelector("select").value =
            localStorage.getItem("language") || "en";
        if (["custom-language", "composite-language"].includes(fault)) {
            const select = document.querySelector("select");
            const control = document.createElement("button");
            const composite = fault === "composite-language";
            if (!composite) {
                control.id = "video-language";
                control.setAttribute("role", "combobox");
                control.setAttribute("aria-label", "Video language");
            }
            const label = code => (composite ? "Video language Select the primary language spoken in the video. " : "") + (code === "hu" ? "Hungarian" : "English");
            control.dataset.code = select.value;
            control.textContent = label(select.value);
            control.onclick = () => {
                const option = document.createElement("button");
                option.setAttribute("role", "option");
                option.setAttribute("aria-selected", String(control.dataset.code === "hu"));
                option.textContent = "Hungarian";
                option.onclick = () => {
                    control.dataset.code = "hu";
                    control.textContent = label("hu");
                    document.querySelector("#save-language").disabled = false;
                    option.remove();
                };
                document.body.append(option);
                option.addEventListener("keydown", event => {
                    if (event.key === "Escape") option.remove();
                });
            };
            select.replaceWith(control);
        }
    }
    for (const key of ['kids', 'age', 'paid', 'ai']) {
        const saved = localStorage.getItem('declaration-' + key) || 'no';
        document.querySelector(`input[name="${key}"][value="${saved}"]`).checked = true;
        for (const radio of document.querySelectorAll(`input[name="${key}"]`)) {
            radio.onchange = () => document.querySelector('#save-language').disabled = false;
        }
    }
    function saveLanguage(button) {
        const language = document.querySelector('select')?.value || document.querySelector('[data-code]').dataset.code;
        const declarations = Object.fromEntries(['kids','age','paid','ai'].map(key => [key, document.querySelector(`input[name="${key}"]:checked`).value]));
        localStorage.setItem('saves', ++window.saves);
        if (fault !== 'language-timeout') button.disabled = true;
        const persist = () => {
            if (fault !== 'language-save') localStorage.setItem('language', language);
            if (fault !== 'declaration-save') {
                for (const [key, value] of Object.entries(declarations)) localStorage.setItem('declaration-' + key, value);
            }
            if (fault !== 'save-no-confirmation') {
                document.querySelector('#save-toast').hidden = false;
                setTimeout(() => document.querySelector('#save-toast').hidden = true, 100);
            }
        };
        if (fault === 'delayed-save') setTimeout(persist, 350);
        else persist();
    }
    let draft = [],
        selected;
    function openEditor() {
        draft = JSON.parse(localStorage.getItem("elements") || "[]");
        document.querySelector("ytcp-endscreen-editor").hidden = false;
        render();
    }
    function render() {
        const holder = document.querySelector("#elements");
        holder.innerHTML = "";
        document.querySelector("#options").innerHTML = "";
        for (const el of draft) {
            const row = document.createElement("ytcp-endscreen-element");
            row.innerHTML = "<span>" + el.type + "</span>";
            row.onclick = () => {
                selected = el;
                showOptions(el);
            };
            holder.append(row);
        }
    }
    function showOptions(el) {
        const panel = document.querySelector("#options");
        panel.innerHTML = "";
        if (el.type === "Video") {
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.setAttribute("aria-label", "Best for viewer");
            radio.checked = el.best;
            radio.onchange = () => (el.best = true);
            panel.append(radio);
        } else if (el.type === "Playlist") {
            panel.innerHTML =
                '<div id="playlist"><a href="https://www.youtube.com/playlist?list=' +
                el.id +
                '">Same playlist name</a></div><button onclick="document.querySelector(\'ytcp-playlist-picker\').hidden=false">Choose playlist</button>';
        } else {
            panel.innerHTML =
                '<div id="subscribe"><a href="/channel/' +
                (fault === "subscribe" ? "UCxxxxxxxxxxxxxxxxxxxxxx" : el.id) +
                '">Same channel name</a></div>';
        }
    }
    function search(value) {
        const holder = document.querySelector("#results");
        holder.innerHTML = "";
        for (const id of ["PLwrongplaylist", playlist]) {
            const row = document.createElement("ytcp-playlist-row");
            row.innerHTML =
                '<a href="https://www.youtube.com/playlist?list=' +
                id +
                '">Same playlist name</a>';
            row.onclick = () => {
                selected.id = id;
                document.querySelector("ytcp-playlist-picker").hidden = true;
                showOptions(selected);
            };
            holder.append(row);
        }
    }
</script>
