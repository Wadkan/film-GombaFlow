tion:absolute;z-index:inherit;pointer-events:auto;bottom:calc(env(safe-area-inset-bottom) + 8px);width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;font-size:32px;line-height:1;box-shadow:0 2px 12px #18281d33}.edge-prev{left:8px}.edge-next{right:8px}.results{display:none;max-height:32vh;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px}.results.open{display:block}.result{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);font-size:16px;min-height:58px}.status{font-size:14px;color:var(--muted);text-align:center;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px}.collapse{min-height:40px;padding:5px 10px;font-size:14px}.restore{position:fixed;z-index:7;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;box-shadow:0 2px 12px #18281d33;font-size:19px}.restore-top{top:calc(env(safe-area-inset-top) + 8px);right:10px}.restore-bottom{bottom:calc(env(safe-area-inset-bottom) + 8px);right:10px}main.no-bottom{padding-bottom:72px}.dialog{position:fixed;inset:0;z-index:8;background:#10251c88;display:none;align-items:flex-end;justify-content:center}.dialog.open{display:flex}.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:720px;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheet h2{margin:0 0 12px}.sheet button{width:100%;text-align:left;margin:5px 0}.sheet .danger{color:#a12828}.empty{text-align:center;padding:52px 10px}.types label{display:block;padding:10px 0}.types input{width:24px;height:24px;vertical-align:middle;margin-right:10px;accent-color:var(--green)}@media(min-width:700px){.bottom{padding-left:max(14px,calc((100vw - 692px)/2));padding-right:max(14px,calc((100vw - 692px)/2))}}

<script>
const parts=[{"id": 1, "chapter": "H — Hook", "title": "Felvehető rész — 1", "clip": "talking head", "location": "A", "cue": "serpenyő timeline 2 script 1 serpenyő", "narration": "Elfogyott a Claude Code kereted? Megnézzük, segít-e egy helyi modell.", "screen": "Kamerába mondom a hookot, majd röviden bevágom az előre elkészített Gomba Limited árrés-kalkulátort. Csak az ellenőrzött próba eredménye látszódjon.", "note": "Az első mondat az első öt másodpercben nevezi meg a cím és thumbnail pain pointját, és rögtön vállalja a megoldhatóság vizsgálatát."}, {"id": 2, "chapter": "O — Mit mutatok meg?", "title": "Felvehető rész — 2", "clip": "b-roll", "location": "B", "cue": "serpenyő timeline 2 script 2 serpenyő", "narration": "Megnézzük, mit jelent a Claude Code keretének elfogyása, és mi fut helyben. Összekötjük a Claude Code-ot egy, a Macünkhöz választott Ollama-modellel. Elkészítünk és kipróbálunk egy kis Gomba Limited árrés-kalkulátort. Megmutatom, milyen kompromisszumokkal jár a helyi modell, és mikor érdemes másik utat választani.", "screen": "Mutassuk egymás után az outline négy pontját a Hyperframes brief szövegével, változatlan sorrendben.", "note": "Az outline szövege megegyezik az 1-story.md és az 1-outline-hyperframes-brief.md pontjaival."}, {"id": 3, "chapter": "C1 — A kész megoldás", "title": "Felvehető rész — 3", "clip": "b-roll", "location": "C", "cue": "serpenyő timeline 2 script 3 serpenyő", "narration": "Ez az eredmény; mindjárt megnézzük, mi változik, amikor a keret elfogyása után helyi modellre váltunk. Ez a Gomba Limited egyszerű ajánlati kalkulátora. Megadom az önköltséget és az ajánlati árat, az alkalmazás pedig kiszámolja a profitot és az árrést. A Gomba Limited pénzügyi szinergiája végre nem egy újabb státuszmeeting: a számológép dolgozik. A példa azt mutatja meg, mire volt képes ez a modell ezen az egy feladaton; ez nem általános minőségi garancia.", "screen": "A már előre elkészített alkalmazásban adj meg egy tesztpéldát: önköltség 80 000 Ft, ajánlati ár 100 000 Ft. Mutasd a kalkulátor tényleges válaszát. Ha a felület 20 000 Ft profitot és 20 százalékos árrést jelez, azt a képernyőn is ellenőrizd; eltérő eredményt ne narrálj helyesnek.", "note": "A várt képlet: profit = ajánlati ár − önköltség; árrés = profit / ajánlati ár. A felületet és a számítást előzetesen kézzel ellenőrizni kell. A működő változat még nem készült el."}, {"id": 4, "chapter": "C2 — Előtte és utána", "title": "Felvehető rész — 4", "clip": "b-roll", "location": "A", "cue": "serpenyő timeline 2 script 4 serpenyő", "narration": "A különbség nem annyi, hogy ugyanaz az agy másik gépben lakik: a modellt, a költségviselést és a sebességet is cseréljük. A modell és az agent két külön dolog. Az előfizetéses vagy API-s Claude-használatnál Anthropic modellje válaszol. Itt ugyanazt a Claude Code eszközt Ollamán keresztül egy másik, helyben futó modellhez irányítjuk. Így változik az adat útja és a számítás terhe is.", "screen": "Jelenítsd meg egymás után az öt rövid összevetést: kézi lépések — várakozás a keret visszaállására vagy helyi modell választása; időráfordítás — nincs saját mérés, a helyi előkészítés plusz idő, a generálás gépfüggő; hibalehetőség — kézi vagy felhőhiba, illetve hibás modellkód vagy memóriahiány; költség — választott csomag/API vagy helyi hardver és áram; felügyelet — mindkét esetben kódellenőrzés és teszt. Ne jeleníts meg számot saját mérés nélkül.", "note": "Az „előtte és utána” a választott felhőszolgáltatói út és a helyi modell minőségi összevetése. Ne állítsunk konkrét idő- vagy költségmegtakarítást. Anthropic setup: https://docs.anthropic.com/en/docs/claude-code/getting-started."}, {"id": 5, "chapter": "C3 — Szükséges szolgáltatások", "title": "Felvehető rész — 5", "clip": "talking head", "location": "B", "cue": "serpenyő timeline 2 script 5 serpenyő", "narration": "Claude Code az eszköz, amely kezeli a kódot; Ollama futtatja a modellt a gépeden. A helyi végpont használatakor nincs modellprovideri tokendíj, de a gép, az áram és a modellletöltés költsége megmarad. A Claude Code hozzáférési feltételei a használt belépési módtól és verziótól függenek: ezt a saját konfiguráción ellenőrizzük, és nem ígérünk ingyenes Anthropic-hozzáférést. A helyi modell nem Anthropic Claude, és nem garantál azonos minőséget.", "screen": "Mutasd az Ollama hivatalos Claude Code-oldalán az integrációs példát és a `ollama launch claude` parancsot, majd válts az Ollama Gemma 4 modelloldalára. Ne mutass bejelentkezési adatot vagy valódi kulcsot.", "note": "Forrás: [F2] https://registry.ollama.com/blog/claude és [F3] https://ollama.com/blog/launch. Anthropic normál Claude Code hitelesítése csomagot vagy Console API-hozzáférést használ; a helyi Ollama-út belépési módját az aktuális Claude Code/Ollama verziókkal előzetesen ellenőrizd. [F6] https://docs.anthropic.com/en/docs/claude-code/getting-started."}, {"id": 6, "chapter": "C3 — Szükséges szolgáltatások", "title": "Felvehető rész — 6", "clip": "talking head", "location": "C", "cue": "serpenyő timeline 2 script 6 serpenyő", "narration": "A másik két út máshol fut. A FreeLLMAPI külső szolgáltatók API-kereteit tereli egy közös végpontra, ezért a kód elhagyja a gépet, és az egyes szolgáltatók keretei érvényesek. Az OpenCode pedig másik kódoló agent, nem Claude Code. Most a helyi Ollama-utat építjük végig; a másik kettő nem része a demónak.", "screen": "Mutass rövid címkéket: „Ollama: helyi modell”, „FreeLLMAPI: külső API-keretek”, „OpenCode: másik agent”. Ne jeleníts meg nem ellenőrzött FreeLLMAPI telepítési parancsot.", "note": "Az OpenCode különálló, nyílt forrású agent: https://opencode.ai/product. A FreeLLMAPI működését a transcript írja le, de a konkrét forrásrepository és aktuális feltételek nincsenek ellenőrizve; ne mondj konkrét szolgáltatószámot, kvótát vagy titkosítási állítást."}, {"id": 7, "chapter": "C4 — Megvalósítás", "title": "Felvehető rész — 7", "clip": "b-roll", "location": "B", "cue": "serpenyő timeline 2 script 7 serpenyő", "narration": "Előbb a géphez választunk modellt, csak utána kötjük rá a Claude Code-ot. A megfelelő modell a géped erőforrásain múlik, ezért először ezeket ellenőrzöm. Az én bemutatógépem M2 Pro chipes MacBook Pro, 16 gigabájt memóriával. A gép teljes memóriáját az operációs rendszer és az alkalmazások is használják, ezért nem a névleges modellméret az egyetlen szempont. Most az Ollamát a hivatalos oldalról telepítem, majd ellenőrzöm, hogy elindul.", "screen": "Mutasd a gép chipjét és memóriáját a Rendszerbeállításokban, de személyes gépazonosítókat ne. Ezután mutasd az Ollama hivatalos letöltési oldalát, telepítsd az alkalmazást a szokásos macOS telepítővel, nyisd meg, és ellenőrizd, hogy az Ollama fut. Az install UI verziót a felvétel előtt pontosítsd.", "note": "Ne futtass vakon shellből másolt install scriptet, ha az app telepítője elérhető. A pontos kattintások és verziók a felvétel előtt ellenőrzendők az ollama.com/download oldalon. Ez nem mérés vagy telepítés ezen a munkameneten belül."}, {"id": 8, "chapter": "C4 — Megvalósítás", "title": "Felvehető rész — 8", "clip": "b-roll", "location": "A", "cue": "serpenyő timeline 2 script 8 serpenyő", "narration": "A megfelelő modell a géped erőforrásain múlik, ezért először ezeket ellenőrzöm. A 16 gigabájtos gépen próbaalapnak a `gemma4:e4b` modellt választom. A modellfájl mérete nem mondja meg önmagában, hogy a futás közbeni memóriaigény belefér-e; ezt a kiválasztott kontextusbeállítással együtt kell kipróbálnom. Ha a modell nem töltődik be stabilan, kisebb modellt választok, és a változást a scriptben is átvezetem.", "screen": "Nyisd meg az Ollama hivatalos Gemma 4 oldalát; mutasd a `gemma4:e4b` változatot és a feltüntetett letöltési mérettartományt. Hozz létre egy `Modelfile`-t a következő tartalommal, így a kontextusérték rögzített és újraellenőrizhető: ```text FROM gemma4:e4b PARAMETER num_ctx 32768 ```` Futtasd: `ollama create gomba-gemma -f Modelfile`, majd `ollama run gomba-gemma`. A 32 768-as kontextus célbeállítás, nem igazolt eredmény: csak akkor folytasd a felvételt ezzel a modellel, ha a Macen a modell betöltődik, válaszol és a Claude Code-feladat közben sem fut memóriahibába. Ha nem, csökkentsd a kontextust vagy válassz kisebb modellt, rögzítsd a tényleges értéket, majd próbáld újra.", "note": "Forrás: [F7] https://ollama.com/library/gemma4 — az oldal a Gemma 4 változatok méretét és coding/agentic célokat sorolja fel. A felvétel előtt ellenőrizd a tényleges változatot, tárhelyet, kontextushosszt és memóriaterhelést M2 Pro 16 GB gépen."}, {"id": 9, "chapter": "C4 — Megvalósítás", "title": "Felvehető rész — 9", "clip": "b-roll", "location": "C", "cue": "serpenyő timeline 2 script 9 serpenyő", "narration": "A modell letöltése előtt összevetem a modelloldalon szereplő méretet a gépünk adataival. Mielőtt rákötöm a kódoló agentet, külön ellenőrzöm, hogy a modell tényleg betöltődik és válaszol. Ha ez a lépés lassú, memóriahibát ad vagy nem indul, ezen a gépen kisebb modellt kell választanom.", "screen": "Ellenőrizd a verziót az `ollama --version` paranccsal, majd a `ollama show gomba-gemma --modelfile` kimenetében igazold a `PARAMETER num_ctx 32768` beállítást. Indítsd a létrehozott modellt az `ollama run gomba-gemma` paranccsal, és adj neki egy rövid, ártalmatlan promptot, például: „Írj egy JavaScript függvényt, amely kiszámolja az árrést.” Mutasd a tényleges választ. Rögzítsd a verziót és azt, hogy a modell válaszolt-e; válaszidőt csak akkor mondj, ha ténylegesen megméred.", "note": "Ez a lépés a betöltést és egyszerű szöveges választ ellenőrzi, nem bizonyítja még a Claude Code tool-calling képességét vagy kódminőséget. Ha a modellválasz hibás vagy a gép terhelése túl magas, állj meg és válassz kisebb modellt."}, {"id": 10, "chapter": "C4 — Megvalósítás", "title": "Felvehető rész — 10", "clip": "b-roll", "location": "A", "cue": "serpenyő timeline 2 script 10 serpenyő", "narration": "A modell már helyben fut; most a Claude Code-ot is erre az útvonalra állítom. Ha még nincs telepítve, az Anthropic hivatalos útmutatója szerint telepítem, majd az Ollama által dokumentált helyi API-címre irányítom. A Claude Code marad az eszköz; a válaszokat a Gemma adja. A Gomba Limitednél ezt úgy hívjuk: modellcsere, ugyanazzal a meetingmentes végrehajtási lánccal.", "screen": "Ha Claude Code még nincs telepítve, ellenőrizd a Node.js verziót (`node --version`), majd az Anthropic által dokumentált telepítést használd: `npm install -g @anthropic-ai/claude-code`. Ezután ugyanabban a terminálablakban állítsd be az Ollama helyi API-címét és az Ollama által dokumentált teszttokent: ```sh export ANTHROPIC_AUTH_TOKEN=ollama export ANTHROPIC_BASE_URL=http://localhost:11434 claude --model gomba-gemma ``` Az `ollama` itt nem valódi kulcs, és csak a helyi Ollama-végponthoz tartozik. Claude Code-ban ellenőrizd, hogy elindult; valódi kulcs ne kerüljön felvételre.", "note": "Forrás: [F2] https://registry.ollama.com/blog/claude dokumentálja az `ANTHROPIC_AUTH_TOKEN=ollama`, `ANTHROPIC_BASE_URL=http://localhost:11434` és `claude --model` helyi útvonalat; [F6] https://docs.anthropic.com/en/docs/claude-code/getting-started a Node.js és Claude Code telepítését. A `gomba-gemma` címkét add át a `--model` paraméternek. Ha a futás Anthropic felhőbejelentkezést vagy külső API-t kér, állj meg, és ne állítsd, hogy helyi a modellút."}, {"id": 11, "chapter": "C4 — Megvalósítás", "title": "Felvehető rész — 11", "clip": "b-roll", "location": "B", "cue": "serpenyő timeline 2 script 11 serpenyő", "narration": "Egy rövid kérdéssel ellenőrzöm, hogy az agent válaszol-e. Ez még nem bizonyítja, hogy jól tud fájlokat módosítani, ezért a következő lépésben egy szűk feladatot adok neki a Gomba Limited projektjében.", "screen": "Claude Code-ban adj egy rövid, ártalmatlan promptot. Amíg válaszol, egy másik terminálablakban futtasd az `ollama ps` parancsot, és mutasd meg, hogy a `gomba-gemma` helyben fut. Ne kérdezd magát a modellt arról, hogy melyik modell: a választ a helyi folyamatlistával ellenőrizd.", "note": "Az `ollama ps` a futó Ollama-modellt ellenőrzi. A Claude Code parancsában is a `gomba-gemma` modellt használd. Ha az `ollama ps` nem mutatja a `gomba-gemma` modellt a kódolási kérés alatt, ne állítsd, hogy a kérés a beállított helyi modellen futott."}, {"id": 12, "chapter": "C4 — Megvalósítás", "title": "Felvehető rész — 12", "clip": "b-roll", "location": "C", "cue": "serpenyő timeline 2 script 12 serpenyő", "narration": "Most kap a helyi modell egy pontos, szűk feladatot; a generált kódot mi futtatjuk és ellenőrizzük. A Gomba Limitednél a scope egy `index.html`: önköltség és ajánlati ár alapján számolja a profitot és az árrést. A profit az ajánlati ár mínusz az önköltség; az árrés a profit osztva az ajánlati árral. Nulla vagy negatív érték esetén ne számoljon, hanem jelezzen érthető hibát. A projektmenedzsment-szinergia kedvéért ez most egyetlen fájlban fér el.", "screen": "A Claude Code munkamappájában kérd: „Kizárólag egy önálló `index.html` fájlt készíts beágyazott HTML/CSS/JavaScript-tel, külső csomag és hálózati függőség nélkül. Legyen két mező: önköltség és ajánlati ár. Számítsd ki a profitot = ajánlati ár − önköltség, az árrést = profit / ajánlati ár × 100%. Nulla vagy negatív bemenetnél mutass érthető hibát, és ne számolj százalékot. Ne hozz létre más fájlt.” Ellenőrizd, hogy csak az `index.html` változott, olvasd át, majd nyisd meg macOS-en a Finderből dupla kattintással vagy futtasd: `open index.html`. Ne használj fejlesztői szervert vagy telepítést.", "note": "Valódi ügyféladat vagy titok ne kerüljön a projektbe. A kódot még futtatás előtt nézd át; ha a Claude Code váratlan jogosultságot vagy fájlműveletet kér, ne fogadd el automatikusan."}, {"id": 13, "chapter": "C5 — Teszt és korlátok", "title": "Felvehető rész — 13", "clip": "b-roll", "location": "A", "cue": "serpenyő timeline 2 script 13 serpenyő", "narration": "A kész felület önmagában nem bizonyíték; nézzük meg a számokat és egy hibás inputot is. Ellenőrizzük a normál esetet. Nyolcvanezer fo const $=id=>document.getElementById(id);const topbar=document.querySelector('.top'),bottombar=document.querySelector('.bottom');$('hideTop').onclick=()=>{topbar.hidden=true;$('showTop').hidden=false};$('showTop').onclick=()=>{topbar.hidden=false;$('showTop').hidden=true};$('hideBottom').onclick=()=>{bottombar.hidden=true;$('showBottom').hidden=false;$('content').classList.add('no-bottom')};$('showBottom').onclick=()=>{bottombar.hidden=false;$('showBottom').hidden=true;$('content').classList.remove('no-bottom')};const escapeHTML=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function fillFilter(id,values,label){let el=$(id);for(const value of values){let o=document.createElement('option');o.value=value;o.textContent=label?label(value):value;el.appendChild(o)}}fillFilter('chapter',[...new Set(parts.map(p=>p.chapter))].filter(Boolean));fillFilter('clip',[...new Set(parts.map(p=>p.clip))].filter(Boolean));fillFilter('location',[...new Set(parts.map(p=>p.location||'__none__'))],v=>v==='__none__'?'Nincs helyszín':'Helyszín '+v);function matches(){let q=$('search').value.toLocaleLowerCase('hu');return parts.filter(p=>($('chapter').value==='all'||p.chapter===$('chapter').value)&&($('clip').value==='all'||p.clip===$('clip').value)&&($('location').value==='all'||($('location').value==='__none__'?!p.location:$('location').value===p.location))&&($('status').value==='all'||($('status').value==='yes')===recorded.has(p.id))&&(!q||p.narration.toLocaleLowerCase('hu').includes(q)))}

['chapter','clip','location','status','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('record').onchange=()=>{let p=parts[index];if($('record').checked)recorded.add(p.id);else recorded.delete(p.id);render()};function move(d){let l=matches(),i=l.findIndex(p=>parts.indexOf(p)===index);if(l.length)index=parts.indexOf(l[Math.max(0,Math.min(l.length-1,i+d))]);render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80)move(dx<0?1:-1)},{passive:true});$('search').onfocus=()=>$('results').classList.add('open');$('search').oninput=()=>{$('results').classList.add('open')};function sheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('dialog').classList.add('open')}$('closeSheet').onclick=()=>$('dialog').classList.remove('open');$('typesBtn').onclick=()=>{sheet('Tartalomtípusok',`<div class="types"><label><input type="checkbox" data-type="narration" ${types.narration?'checked':''}> Narráció</label><label><input type="checkbox" data-type="screen" ${types.screen?'checked':''}> Képernyő-akció</label><label><input type="checkbox" data-type="note" ${types.note?'checked':''}> Gyártási megjegyzés</label><p>A beszélt cue mindig látható marad.</p></div>`);document.querySelectorAll('[data-type]').forEach(c=>c.onchange=()=>{types[c.dataset.type]=c.checked;render()})};$('libraryBtn').onclick=()=>{sheet('Scriptek',`<p>Helyi scriptlista · minta</p><button onclick="document.getElementById('dialog').classList.remove('open')">● Claude Code limitbe futott? Próbáld helyi modellel</button><button id="deleteTopic" class="danger">Téma törlése…</button><p>A mintaállapot nem mentődik.</p>`);$('deleteTopic').onclick=()=>sheet('Téma törlése?',`<p>A script és a hozzá tartozó felvételi jelölések törlődnének.</p><button class="danger" oncli
