<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GombaFlow · felvételi néző</title>
<style>
:root{font:20px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;color:#17221e;background:#f1f4f1;--green:#145b43;--line:#d5ded8;--muted:#52645a}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,select,input{font:inherit;color:inherit}button,select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:white;padding:8px 12px}button:active{background:#e2eee7}.top{position:sticky;top:0;z-index:3;background:#f1f4f1;padding:8px 12px 10px;border-bottom:1px solid var(--line);font-size:13px}.brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}.brand button{min-height:36px;padding:4px 8px;font-size:13px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.filters button,.filters select{min-height:38px;width:100%;padding:5px 8px;font-size:13px}main{padding:18px 16px 245px;max-width:720px;margin:auto}.sample{display:inline-block;background:#fff4d1;color:#624900;border-radius:20px;padding:4px 10px;font-size:14px;font-weight:700}.eyebrow{font-size:15px;color:var(--muted);margin:16px 0 4px}.title{font-size:26px;line-height:1.2;margin:0 0 14px}.note{border-left:4px solid #9cac9f;padding:8px 12px;margin:12px 0;background:#e8ede9;border-radius:0 10px 10px 0;font-size:17px}.block{margin:14px 0}.block h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px}.block p{margin:0}.bottom{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 66px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #18281d14;font-size:13px;line-height:1.3}.cue-row{display:flex;gap:12px;align-items:center}.cue{font-weight:700;color:var(--green);flex:1;font-size:13px}.picker{display:grid;grid-template-columns:1fr;gap:6px;margin-top:5px}.picker input{min-width:0;width:100%;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px}.status{font-size:12px;color:var(--muted);text-align:center;margin-top:3px;display:flex;align-items:center;justify-content:center;gap:8px}.record-control{position:fixed;z-index:9;right:12px;bottom:calc(env(safe-area-inset-bottom) + 174px);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:white;box-shadow:0 2px 12px #18281d33}.record{width:22px;height:22px;margin:0;border:1px solid var(--green);accent-color:var(--green);flex:none}#edgeNavLayer{position:fixed;inset:0;z-index:20;pointer-events:none}.edge-nav{position:absolute;z-index:inherit;pointer-events:auto;bottom:calc(env(safe-area-inset-bottom) + 8px);width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;font-size:32px;line-height:1;box-shadow:0 2px 12px #18281d33}.edge-prev{left:8px}.edge-next{right:8px}.results{display:none;max-height:32vh;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px}.results.open{display:block}.result{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);font-size:14px;min-height:48px}.collapse{min-height:36px;padding:4px 8px;font-size:13px}.restore{position:fixed;z-index:7;right:10px;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;box-shadow:0 2px 12px #18281d33;font-size:21px}.restore-top{bottom:calc(env(safe-area-inset-bottom) + 120px)}.restore-bottom{bottom:calc(env(safe-area-inset-bottom) + 70px)}main.no-bottom{padding-bottom:72px}.dialog{position:fixed;inset:0;z-index:30;background:#10251c88;display:none;align-items:flex-end;justify-content:center}.dialog.open{display:flex}.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:720px;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;font-size:14px}.sheet h2{margin:0 0 12px;font-size:18px}.sheet button{width:100%;text-align:left;margin:5px 0}.sheet .danger{color:#a12828}.empty{text-align:center;padding:52px 10px}.types label{display:block;padding:6px 0;font-size:14px}.types input{width:20px;height:20px;vertical-align:middle;margin-right:10px;accent-color:var(--green)}@media(min-width:700px){.bottom{padding-left:max(14px,calc((100vw - 692px)/2));padding-right:max(14px,calc((100vw - 692px)/2))}}
</style>
</head>
<body>
<pre id="viewerDiagnostic" style="position:fixed;inset:12px;z-index:9999;background:#fff;color:#900;border:3px solid #900;padding:16px;overflow:auto;white-space:pre-wrap;font:18px/1.5 monospace" hidden></pre>
<script>
window.viewerDiagnosticState = {ready:false,error:null,stage:'HTML betöltve'};
window.viewerShowError = function(error) {
  var message=String(error && (error.stack || error.message) || error);
  window.viewerDiagnosticState.error=message;
  var box=document.getElementById('viewerDiagnostic');
  box.textContent='GombaFlow diagnosztika D3\nLépés: '+window.viewerDiagnosticState.stage+'\n\n'+message;
  box.hidden=false;
};
window.addEventListener('error',function(event){window.viewerShowError((event.message||'JavaScript hiba')+'\n'+(event.filename||'')+':'+event.lineno+':'+event.colno+'\n'+(event.error&&event.error.stack||''));});
window.addEventListener('unhandledrejection',function(event){window.viewerShowError(event.reason);});
window.viewerDiagnosticState.stage='Olvasó indítása';
</script>
<header class="top"><div class="brand"><strong>GombaFlow · Felvételi néző</strong><div style="display:flex;gap:6px"><button id="exportChecksBtn" disabled>Pipák exportja</button><button id="importChecksBtn" disabled>Pipák importja</button><button id="libraryBtn">Scriptek</button></div></div><div class="filters"><select id="chapter" aria-label="Fejezet"><option value="all">Minden fejezet</option></select><select id="clip" aria-label="Felvétel típusa"><option value="all">Minden típus</option></select><select id="location" aria-label="Helyszín"><option value="all">Minden helyszín</option></select><select id="status" aria-label="Felvételi állapot"><option value="all">Minden állapot</option><option value="no">Nincs felvéve</option><option value="yes">Felvéve</option></select><button id="typesBtn">Tartalomtípusok ☰</button></div></header>
<main id="content"></main>
<footer class="bottom"><div class="cue-row"><div class="cue" id="cue"></div></div><div class="picker"><input id="search" placeholder="Keresés a narrációban…" aria-label="Keresés a narrációban"></div><div class="results" id="results"></div><div class="status"><span id="saveStatus">Offline könyvtár · mentésre kész</span></div></footer>
<div id="edgeNavLayer"><button class="edge-nav edge-prev" id="prev" aria-label="Előző rész">‹</button><button class="edge-nav edge-next" id="next" aria-label="Következő rész">›</button></div><button class="restore restore-top" id="showTop" aria-label="Felső sáv váltása" title="Felső sáv váltása">↑</button><button class="restore restore-bottom" id="showBottom" aria-label="Alsó sáv váltása" title="Alsó sáv váltása">↓</button><label class="record-control" title="Felvéve"><input class="record" id="record" type="checkbox" aria-label="Felvéve"></label>
<div class="dialog" id="dialog"><section class="sheet"><h2 id="sheetTitle"></h2><div id="sheetBody"></div><button id="closeSheet">Bezárás</button></section></div>
<script>
const module = {exports:{}};
/* CORE_SOURCE */
const core = module.exports;
let parts=[],index=-1,recorded=new Set(),types={narration:true,screen:true,note:true};
let currentTopic=null,currentPrefs=null,displayedPartKey=null,savedTopics=[];
const topics=new Map();
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.viewerHost=window.viewerHost||{send:async()=>({ok:true})};
async function send(action){$('saveStatus').textContent='Mentés…';const result=await window.viewerHost.send(action);if(!result||result.ok===false)throw Error(result?.error||'A mentés nem sikerült');if(result.state?.topics)savedTopics=Object.keys(result.state.topics);$('saveStatus').textContent='Offline mentve';return result}
function preferences(){return {chapter:$('chapter').value,clip:$('clip').value,location:$('location').value,status:$('status').value==='no'?'not-recorded':$('status').value==='yes'?'recorded':'all',search:$('search').value,types:{...types},topCollapsed:topbar.hidden,bottomCollapsed:bottombar.hidden}}
async function savePreferences(){await send({type:'preferences',topicId:currentTopic,value:preferences()})}
function fillFilter(id,values,label){const el=$(id);for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=label?label(value):value;el.appendChild(o)}}
function matches(){const q=$('search').value.toLocaleLowerCase('hu');return parts.filter(p=>($('chapter').value==='all'||p.chapter===$('chapter').value)&&($('clip').value==='all'||p.clip===$('clip').value)&&($('location').value==='all'||$('location').value===p.location)&&($('status').value==='all'||($('status').value==='yes')===recorded.has(p.id))&&(!q||p.narration.toLocaleLowerCase('hu').includes(q)))}
window.viewerOpen=(markdown,saved={})=>{
 const parsed=core.parseScript(markdown);currentTopic=parsed.topicId;currentPrefs=saved.preferences||null;savedTopics=saved.topics||[];
 recorded=new Set(Object.entries(saved.recorded||{}).filter(([,value])=>value===true).map(([id])=>Number(id)));
 types={narration:true,screen:true,note:true,...(currentPrefs?.types||{})};
 parts=parsed.parts.map(p=>({...p,title:'Felvehető rész — '+p.id,clip:p.clipType,cue:p.spokenCue,screen:p.screenAction,note:[...p.chapterNotes,...p.productionNotes].join('\n\n')}));
 for(const id of ['chapter','clip','location']){const label={chapter:'fejezet',clip:'típus',location:'helyszín'}[id];$(id).replaceChildren(new Option('Minden '+label,'all'));fillFilter(id,[...new Set(parts.map(p=>p[id]))],id==='location'?v=>'Helyszín '+v:null)}
 index=parts.findIndex(p=>String(p.id)===String(saved.partId));if(index<0)index=0;
 if(currentPrefs){for(const id of ['chapter','clip','location','search'])if(currentPrefs[id]!==undefined){const el=$(id),value=currentPrefs[id];if(id!=='search'&&value!=='all'&&![...el.options].some(o=>o.value===value)){const option=new Option('Nem elérhető: '+value,value);el.add(option)}el.value=value}$('status').value=currentPrefs.status==='not-recorded'?'no':currentPrefs.status==='recorded'?'yes':currentPrefs.status||'all'}else $('status').value='no';
 applyBarState(currentPrefs?.topCollapsed===true,currentPrefs?.bottomCollapsed===true);
 render();
};
window.viewerShowLibrary=(view={})=>{const list=view.topics||[];$('content').innerHTML=`<div class=\"empty\"><h1>Scriptek</h1>${list.length?list.map(id=>`<section class=\"block\"><strong>${escapeHTML(id)}</strong><div><button data-open=\"${escapeHTML(id)}\">Megnyitás</button> <button data-delete=\"${escapeHTML(id)}\">Törlés</button></div></section>`).join(''):'<p>Nincs mentett script</p>'}<button id=\"pickScript\">Másik MD megnyitása…</button></div>`;$('cue').textContent='Offline könyvtár';$('record').disabled=true;$('prev').disabled=true;$('next').disabled=true;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>window.viewerHost.send({type:'open-topic',topicId:b.dataset.open}).catch(window.viewerShowError));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const id=b.dataset.delete;window.viewerHost.send({type:'delete',topicId:id}).then(a=>{if(a.state)window.viewerShowLibrary({topics:Object.keys(a.state.topics||{})})}).catch(window.viewerShowError)});$('pickScript').onclick=()=>window.viewerHost.send({type:'open-md'}).catch(window.viewerShowError)};
const topbar=document.querySelector('.top'),bottombar=document.querySelector('.bottom');
function applyBarState(topCollapsed,bottomCollapsed){
 topbar.hidden=topCollapsed;
 bottombar.hidden=bottomCollapsed;
 $('content').classList.toggle('no-bottom',bottomCollapsed);
}
let savingBars=false;
async function saveBarState(topCollapsed,bottomCollapsed){
 if(savingBars)return;
 savingBars=true;
 const previous=[topbar.hidden,bottombar.hidden];
 applyBarState(topCollapsed,bottomCollapsed);
 try{await savePreferences()}catch(error){applyBarState(...previous);window.viewerShowError(error)}finally{savingBars=false}
}
$('showTop').onclick=()=>saveBarState(!topbar.hidden,bottombar.hidden);
$('showBottom').onclick=()=>saveBarState(topbar.hidden,!bottombar.hidden);

function render(){const list=matches();if(!list.some(p=>p.id===parts[index]?.id))index=list.length?parts.indexOf(list[0]):-1;const p=parts[index];$('content').innerHTML=p?`<span class="sample">OFFLINE · MENTETT</span><div class="eyebrow">${escapeHTML(p.chapter)} · ${escapeHTML(p.clip)} · Helyszín ${escapeHTML(p.location)}</div><h1 class="title">${escapeHTML(p.title)}</h1>${types.narration?`<section class="block"><h3>Narráció</h3><p>${escapeHTML(p.narration)}</p></section>`:''}${types.screen?`<section class="block"><h3>Képernyő-akció</h3><p>${escapeHTML(p.screen)}</p></section>`:''}${types.note?`<aside class="note">${escapeHTML(p.note)}</aside>`:''}`:`<div class="empty"><h2>Nincs találat</h2><p>A szűréshez nincs illő rész.</p><button id="allStatuses">Minden felvételi állapot mutatása</button></div>`;
 $('cue').textContent=p?`#${p.id} · ${p.cue}`:'Nincs kiválasztott rész';$('record').checked=!!p&&recorded.has(p.id);$('record').disabled=!p;$('prev').disabled=!p||list[0]?.id===p.id;$('next').disabled=!p||list.at(-1)?.id===p.id;
 $('results').innerHTML=list.map(x=>`<button class="result" data-id="${x.id}">#${x.id} · ${escapeHTML(x.chapter)}<br><span style="color:#52645a">${escapeHTML(x.narration.slice(0,90))}</span></button>`).join('');
 document.querySelectorAll('.result').forEach(b=>b.onclick=async()=>{const target=parts.find(x=>x.id===+b.dataset.id);try{await send({type:'cursor',topicId:currentTopic,id:String(target.id)});index=parts.indexOf(target);$('results').classList.remove('open');render()}catch(e){window.viewerShowError(e)}});
 const all=$('allStatuses');if(all)all.onclick=async()=>{try{$('status').value='all';await savePreferences();render()}catch(e){window.viewerShowError(e)}};
 const key=p?currentTopic+':'+p.id:null;if(key!==displayedPartKey){displayedPartKey=key;window.scrollTo(0,0)}
}
async function move(delta){const list=matches(),i=list.findIndex(p=>parts.indexOf(p)===index),target=list[Math.max(0,Math.min(list.length-1,i+delta))];if(!target)return;try{await send({type:'cursor',topicId:currentTopic,id:String(target.id)});index=parts.indexOf(target);render()}catch(e){window.viewerShowError(e)}}
$('record').onchange=async()=>{const part=parts[index];if(!part)return;const value=$('record').checked;try{await send({type:'record',topicId:currentTopic,id:String(part.id),value});if(value)recorded.add(part.id);else recorded.delete(part.id);const rest=matches(),next=rest.find(x=>parts.indexOf(x)>index)||rest[0];if(!rest.some(x=>x.id===part.id)){if(next)await send({type:'cursor',topicId:currentTopic,id:String(next.id)});index=next?parts.indexOf(next):-1}render()}catch(e){$('record').checked=!value;window.viewerShowError(e)}};
for(const id of ['chapter','clip','location','status'])$(id).addEventListener('change',async()=>{try{await savePreferences();render()}catch(e){window.viewerShowError(e)}});
let searchTimer=null;$('search').addEventListener('input',()=>{$('results').classList.add('open');render();clearTimeout(searchTimer);searchTimer=setTimeout(()=>savePreferences().catch(window.viewerShowError),250)});$('search').onfocus=()=>$('results').classList.add('open');
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let touch=null;const reader=$('content');reader.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});reader.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)move(dx<0?1:-1)},{passive:true});
function sheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('dialog').classList.add('open')}$('closeSheet').onclick=()=>$('dialog').classList.remove('open');
$('typesBtn').onclick=()=>{sheet('Tartalomtípusok',`<div class="types"><label><input type="checkbox" data-type="narration" ${types.narration?'checked':''}> Narráció</label><label><input type="checkbox" data-type="screen" ${types.screen?'checked':''}> Képernyő-akció</label><label><input type="checkbox" data-type="note" ${types.note?'checked':''}> Gyártási megjegyzés</label><p>A beszélt cue mindig látható marad.</p></div>`);document.querySelectorAll('[data-type]').forEach(c=>c.onchange=async()=>{types[c.dataset.type]=c.checked;try{await savePreferences();render()}catch(e){window.viewerShowError(e)}})};
$('libraryBtn').textContent='Scriptek';$('libraryBtn').onclick=()=>window.viewerShowLibrary({topics:savedTopics});
window.viewerDiagnosticState.ready=true;
window.viewerDiagnosticState.stage='Olvasó kész';
</script>
</body></html>
