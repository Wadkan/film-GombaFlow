<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GombaFlow · felvételi néző</title>
<style>
:root{font:20px/1.45 -apple-system,BlinkMacSystemFont,sans-serif;color:#17221e;background:#f1f4f1;--green:#145b43;--line:#d5ded8;--muted:#52645a}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,select,input{font:inherit;color:inherit}button,select{min-height:48px;border:1px solid var(--line);border-radius:12px;background:white;padding:8px 12px}button:active{background:#e2eee7}.top{position:sticky;top:0;z-index:3;background:#f1f4f1;padding:10px 14px 12px;border-bottom:1px solid var(--line)}.brand{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:8px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters select{width:100%}main{padding:18px 16px 245px;max-width:720px;margin:auto}.sample{display:inline-block;background:#fff4d1;color:#624900;border-radius:20px;padding:4px 10px;font-size:14px;font-weight:700}.eyebrow{font-size:15px;color:var(--muted);margin:16px 0 4px}.title{font-size:26px;line-height:1.2;margin:0 0 14px}.note{border-left:4px solid #9cac9f;padding:8px 12px;margin:12px 0;background:#e8ede9;border-radius:0 10px 10px 0;font-size:17px}.block{margin:14px 0}.block h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px}.block p{margin:0}.bottom{position:fixed;z-index:4;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 66px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #18281d14}.cue-row{display:flex;gap:12px;align-items:center}.cue{font-weight:750;color:var(--green);flex:1}.record{width:62px;height:62px;border:2px solid var(--green);border-radius:16px;accent-color:var(--green);flex:none}.picker{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.picker input{min-width:0;width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 12px}#edgeNavLayer{position:fixed;inset:0;z-index:20;pointer-events:none}.edge-nav{position:absolute;z-index:inherit;pointer-events:auto;bottom:calc(env(safe-area-inset-bottom) + 8px);width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;font-size:32px;line-height:1;box-shadow:0 2px 12px #18281d33}.edge-prev{left:8px}.edge-next{right:8px}.results{display:none;max-height:32vh;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:12px}.results.open{display:block}.result{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);font-size:16px;min-height:58px}.status{font-size:14px;color:var(--muted);text-align:center;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px}.collapse{min-height:40px;padding:5px 10px;font-size:14px}.restore{position:fixed;z-index:7;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;box-shadow:0 2px 12px #18281d33;font-size:19px}.restore-top{top:calc(env(safe-area-inset-top) + 8px);right:10px}.restore-bottom{bottom:calc(env(safe-area-inset-bottom) + 8px);right:10px}main.no-bottom{padding-bottom:72px}.dialog{position:fixed;inset:0;z-index:8;background:#10251c88;display:none;align-items:flex-end;justify-content:center}.dialog.open{display:flex}.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:720px;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheet h2{margin:0 0 12px}.sheet button{width:100%;text-align:left;margin:5px 0}.sheet .danger{color:#a12828}.empty{text-align:center;padding:52px 10px}.types label{display:block;padding:10px 0}.types input{width:24px;height:24px;vertical-align:middle;margin-right:10px;accent-color:var(--green)}@media(min-width:700px){.bottom{padding-left:max(14px,calc((100vw - 692px)/2));padding-right:max(14px,calc((100vw - 692px)/2))}}
</style>
</head>
<body>
<pre id="viewerDiagnostic" style="position:fixed;inset:12px;z-index:9999;background:#fff;color:#900;border:3px solid #900;padding:16px;overflow:auto;white-space:pre-wrap;font:18px/1.5 monospace" hidden></pre>
<script>
window.viewerDiagnosticState = {ready:false,error:null,stage:'HTML betöltve'};
window.viewerShowError = function(error) {
  var message=String(error && (error.stack || error.message) || error);
  window.viewerDiagnosticState.error=message;
  var box=document.getElementById('viewerDiagnostic');
  box.textContent='GombaFlow diagnosztika D3\nLépés: '+window.viewerDiagnosticState.stage+'\n\n'+message;
  box.hidden=false;
};
window.addEventListener('error',function(event){window.viewerShowError((event.message||'JavaScript hiba')+'\n'+(event.filename||'')+':'+event.lineno+':'+event.colno+'\n'+(event.error&&event.error.stack||''));});
window.addEventListener('unhandledrejection',function(event){window.viewerShowError(event.reason);});
window.viewerDiagnosticState.stage='Olvasó indítása';
</script>
<header class="top"><div class="brand"><strong>GombaFlow · Felvételi néző</strong><div style="display:flex;gap:6px"><button class="collapse" id="hideTop" aria-label="Felső sáv elrejtése" title="Felső sáv elrejtése">⌃</button><button id="libraryBtn">Scriptek</button></div></div><div class="filters"><select id="chapter" aria-label="Fejezet"><option value="all">Minden fejezet</option></select><select id="clip" aria-label="Felvétel típusa"><option value="all">Minden típus</option></select><select id="location" aria-label="Helyszín"><option value="all">Minden helyszín</option></select><select id="status" aria-label="Felvételi állapot"><option value="all">Minden állapot</option><option value="no">Nincs felvéve</option><option value="yes">Felvéve</option></select><button id="typesBtn">Tartalomtípusok ☰</button></div></header>
<main id="content"></main>
<footer class="bottom"><div class="cue-row"><div class="cue" id="cue"></div><label title="Felvéve"><input class="record" id="record" type="checkbox" aria-label="Felvéve"></label></div><div class="picker"><input id="search" placeholder="Keresés a narrációban…" aria-label="Keresés a narrációban"></div><div class="results" id="results"></div><div class="status"><span>Munkamenet · újraindításkor elvész</span><button class="collapse" id="hideBottom" aria-label="Alsó sáv elrejtése" title="Alsó sáv elrejtése">⌄</button></div></footer>
<div id="edgeNavLayer"><button class="edge-nav edge-prev" id="prev" aria-label="Előző rész">‹</button><button class="edge-nav edge-next" id="next" aria-label="Következő rész">›</button></div><button class="restore restore-top" id="showTop" aria-label="Felső sáv megjelenítése" title="Felső sáv megjelenítése" hidden>☰↑</button><button class="restore restore-bottom" id="showBottom" aria-label="Alsó sáv megjelenítése" title="Alsó sáv megjelenítése" hidden>☰↓</button>
<div class="dialog" id="dialog"><section class="sheet"><h2 id="sheetTitle"></h2><div id="sheetBody"></div><button id="closeSheet">Bezárás</button></section></div>
<script>
const module = {exports:{}};
/* CORE_SOURCE */
const core = module.exports;
let parts=[],index=-1,recorded=new Set(),types={narration:true,screen:true,note:true};
const topics=new Map();
window.viewerOpen = markdown => {
  const parsed=core.parseScript(markdown);
  const prior=topics.get(parsed.topicId);
  topics.set(parsed.topicId,{parsed,markdown,recorded:prior?.recorded||new Set()});
  parts=parsed.parts.map(p=>({...p,title:'Felvehető rész — '+p.id,clip:p.clipType,cue:p.spokenCue,screen:p.screenAction,note:[...p.chapterNotes,...p.productionNotes].join('\n\n')}));
  recorded=topics.get(parsed.topicId).recorded; window.currentTopic=parsed.topicId; index=0;
  for(const id of ['chapter','clip','location']) { $(id).replaceChildren(new Option('Minden '+({chapter:'fejezet',clip:'típus',location:'helyszín'}[id]),'all')); fillFilter(id,[...new Set(parts.map(p=>p[id]))],id==='location'?v=>'Helyszín '+v:null); }
  render();
};
const $=id=>document.getElementById(id);const topbar=document.querySelector('.top'),bottombar=document.querySelector('.bottom');$('hideTop').onclick=()=>{topbar.hidden=true;$('showTop').hidden=false};$('showTop').onclick=()=>{topbar.hidden=false;$('showTop').hidden=true};$('hideBottom').onclick=()=>{bottombar.hidden=true;$('showBottom').hidden=false;$('content').classList.add('no-bottom')};$('showBottom').onclick=()=>{bottombar.hidden=false;$('showBottom').hidden=true;$('content').classList.remove('no-bottom')};const escapeHTML=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function fillFilter(id,values,label){let el=$(id);for(const value of values){let o=document.createElement('option');o.value=value;o.textContent=label?label(value):value;el.appendChild(o)}}function matches(){let q=$('search').value.toLocaleLowerCase('hu');return parts.filter(p=>($('chapter').value==='all'||p.chapter===$('chapter').value)&&($('clip').value==='all'||p.clip===$('clip').value)&&($('location').value==='all'||($('location').value==='__none__'?!p.location:$('location').value===p.location))&&($('status').value==='all'||($('status').value==='yes')===recorded.has(p.id))&&(!q||p.narration.toLocaleLowerCase('hu').includes(q)))}
let displayedPartKey=null;
function render(){let list=matches();if(!list.some(p=>p.id===parts[index]?.id))index=list.length?parts.indexOf(list[0]):-1;let p=parts[index];$('content').innerHTML=p?`<span class="sample">MUNKAMENET · NEM MENTŐDIK</span><div class="eyebrow">${escapeHTML(p.chapter)} · ${escapeHTML(p.clip)} · ${escapeHTML(p.location?'Helyszín '+p.location:'nincs helyszín')}</div><h1 class="title">${escapeHTML(p.title)}</h1>${types.narration?`<section class="block"><h3>Narráció</h3><p>${escapeHTML(p.narration)}</p></section>`:''}${types.screen?`<section class="block"><h3>Képernyő-akció</h3><p>${escapeHTML(p.screen)}</p></section>`:''}${types.note?`<aside class="note">${escapeHTML(p.note)}</aside>`:''}`:`<div class="empty"><h2>${parts.length?"Nincs találat":"Nyiss meg egy scriptet"}</h2><p>${parts.length?"A szűréshez nincs illő rész.":"Scriptek → MD megnyitása…"}</p><button id="allStatuses">Minden felvételi állapot mutatása</button></div>`;$('cue').textContent=p?`#${p.id} · ${p.cue}`:'Nincs kiválasztott rész';$('record').checked=!!p&&recorded.has(p.id);$('record').disabled=!p;$('prev').disabled=!p||list[0]?.id===p.id;$('next').disabled=!p||list.at(-1)?.id===p.id;$('results').innerHTML=list.map(x=>`<button class="result" data-id="${x.id}">#${x.id} · ${escapeHTML(x.chapter)}<br><span style="color:#52645a">${escapeHTML(x.narration.slice(0,90))}</span></button>`).join('');document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{index=parts.findIndex(x=>x.id===+b.dataset.id);$('results').classList.remove('open');render()});let a=$('allStatuses');if(a)a.onclick=()=>{$('status').value='all';render()};const partKey=p?window.currentTopic+':'+p.id:null;if(partKey!==displayedPartKey){displayedPartKey=partKey;window.scrollTo(0,0)}}
['chapter','clip','location','status','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('record').onchange=()=>{let p=parts[index];if(!p)return;if($('record').checked)recorded.add(p.id);else recorded.delete(p.id);let remaining=matches();const next=remaining.find(x=>parts.indexOf(x)>index)||remaining[0];if(!remaining.some(x=>x.id===p.id))index=next?parts.indexOf(next):-1;render()};function move(d){let l=matches(),i=l.findIndex(p=>parts.indexOf(p)===index);if(l.length)index=parts.indexOf(l[Math.max(0,Math.min(l.length-1,i+d))]);render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);let touch=null;const reader=$('content');reader.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});reader.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)move(dx<0?1:-1)},{passive:true});$('search').onfocus=()=>$('results').classList.add('open');$('search').oninput=()=>{$('results').classList.add('open')};function sheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('dialog').classList.add('open')}$('closeSheet').onclick=()=>$('dialog').classList.remove('open');$('typesBtn').onclick=()=>{sheet('Tartalomtípusok',`<div class="types"><label><input type="checkbox" data-type="narration" ${types.narration?'checked':''}> Narráció</label><label><input type="checkbox" data-type="screen" ${types.screen?'checked':''}> Képernyő-akció</label><label><input type="checkbox" data-type="note" ${types.note?'checked':''}> Gyártási megjegyzés</label><p>A beszélt cue mindig látható marad.</p></div>`);document.querySelectorAll('[data-type]').forEach(c=>c.onchange=()=>{types[c.dataset.type]=c.checked;render()})};$('libraryBtn').textContent='Másik MD…';
$('libraryBtn').onclick=()=>alert('Másik MD megnyitásához zárd be a nézőt, majd indítsd újra a GombaFlowViewer programot.');
$('status').value='no';render();
window.viewerDiagnosticState.ready=true;
window.viewerDiagnosticState.stage='Olvasó kész';
</script>
</body></html>
