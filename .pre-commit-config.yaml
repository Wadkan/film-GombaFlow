default_stages: [pre-commit]

repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.11
      hooks:
          - id: ruff-check
            args: [--fix]
            files: \.py$

          - id: ruff-format
            files: \.py$

    - repo: https://github.com/pycqa/isort
      rev: 8.0.1
      hooks:
          - id: isort
            files: \.py$

    - repo: local
      hooks:
          - id: docs-format
            name: format markdown docs
            entry: make docs-format
            language: system
            pass_filenames: false
            files: \.(md|mdx)$
